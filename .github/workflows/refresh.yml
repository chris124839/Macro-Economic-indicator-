name: Refresh macro data
on:
  workflow_dispatch:
  schedule:
    # 07:30 India Standard Time = 02:00 UTC. GitHub may delay scheduled runs.
    - cron: "0 2 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch FRED official series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python src_collect.py
      - name: Commit new observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh macro observations"
            git push
          else
            echo "No changes to commit"
          fi
