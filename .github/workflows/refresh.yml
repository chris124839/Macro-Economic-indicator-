name: Refresh Indian macro data
on:
  workflow_dispatch:
  schedule:
    # 07:30 IST = 02:00 UTC; GitHub may delay scheduled jobs.
    - cron: "0 2 * * *"
  push:
    paths:
      - "collect_official.py"
      - "collect_india.py"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch official RBI historical data
        run: python collect_official.py
      - name: Normalize additional uploaded Indian source files
        if: always()
        run: python collect_india.py
      - name: Verify historical data coverage
        if: always()
        run: |
          python - <<'PY'
          import csv, sys
          from pathlib import Path
          p = Path("data/observations.csv")
          if not p.exists():
              sys.exit("data/observations.csv not found")
          with p.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          print(f"Total observations: {len(rows)}")
          required = ["india_cpi_yoy", "india_wpi_yoy", "rbi_repo", "rbi_reverse_repo", "rbi_sdf"]
          counts = {k: sum(r.get("indicator") == k for r in rows) for k in required}
          for key, count in counts.items():
              print(f"{key}: {count}")
          missing = [k for k, count in counts.items() if count == 0]
          if missing:
              sys.exit("Missing historical series: " + ", ".join(missing))
          PY
      - name: Commit refreshed observations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.csv
          if ! git diff --cached --quiet; then
            git commit -m "Import official Indian macro history"
            git push
          else
            echo "No changes to commit"
          fi
