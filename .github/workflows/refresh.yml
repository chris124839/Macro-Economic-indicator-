name: Refresh Indian macro data
on:
  workflow_dispatch:
  schedule:
    # 07:30 IST = 02:00 UTC; GitHub may delay scheduled jobs.
    - cron: "0 2 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Normalize uploaded Indian source files
        run: python collect_india.py
      - name: Commit refreshed observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Indian macro observations"
            git push
          else
            echo "No changes to commit"
          fi
